name: Build

# Changes that only touch docs skip CI (path filters don't apply to tags).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels its running build. Running builds on main and tags always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            generator: Ninja
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip
            generator: Ninja
          - name: Windows
            os: windows-2022
            pluginval: pluginval_Windows.zip
            generator: Visual Studio 17 2022

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Tempo benchmark (66 synthetic genre tracks, hard mode)
        if: runner.os == 'Linux'
        run: build/kt_tempo_bench --hard --min 64

      # Pinned so a new pluginval release can't turn CI red without a code change.
      - name: Download pluginval
        shell: bash
        run: |
          curl -fsSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/${{ matrix.pluginval }}"
          unzip -o pluginval.zip -d pluginval

      - name: Validate VST3 (pluginval)
        shell: bash
        run: |
          VST3="build/KeyTempo_artefacts/Release/VST3/KeyTempo.vst3"
          case "${{ runner.os }}" in
            Linux)   xvfb-run -a ./pluginval/pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            macOS)   ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            Windows) ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process "$VST3" ;;
          esac

      - name: Validate Audio Unit (auval)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/KeyTempo_artefacts/Release/AU/KeyTempo.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Kt01 Ktpo

      - name: Package
        shell: bash
        run: |
          cd build/KeyTempo_artefacts/Release
          rm -f libKeyTempo_SharedCode.a KeyTempo_SharedCode.lib
          cmake -E tar cf "$GITHUB_WORKSPACE/KeyTempo-${{ matrix.name }}.zip" --format=zip -- *

      - uses: actions/upload-artifact@v7
        with:
          name: KeyTempo-${{ matrix.name }}
          path: KeyTempo-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
