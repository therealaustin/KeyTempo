name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            pluginval: pluginval_Linux.zip
            generator: Ninja
          - name: macOS
            os: macos-14
            pluginval: pluginval_macOS.zip
            generator: Ninja
          - name: Windows
            os: windows-2022
            pluginval: pluginval_Windows.zip
            generator: Visual Studio 17 2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libglu1-mesa-dev mesa-common-dev libegl-dev xvfb

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Tempo benchmark (63 synthetic genre tracks, hard mode)
        if: runner.os == 'Linux'
        run: build/kt_tempo_bench --hard --min 61

      - name: Download pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -o pluginval.zip -d pluginval

      - name: Validate VST3 (pluginval)
        shell: bash
        run: |
          VST3="build/KeyTempo_artefacts/Release/VST3/KeyTempo.vst3"
          case "${{ runner.os }}" in
            Linux)   xvfb-run -a ./pluginval/pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            macOS)   ./pluginval/pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process "$VST3" ;;
            Windows) ./pluginval/pluginval.exe --strictness-level 10 --validate-in-process "$VST3" ;;
          esac

      - name: Validate Audio Unit (auval)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/KeyTempo_artefacts/Release/AU/KeyTempo.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Kt01 Ktpo

      - name: Package
        shell: bash
        run: |
          cd build/KeyTempo_artefacts/Release
          rm -f libKeyTempo_SharedCode.a KeyTempo_SharedCode.lib
          cmake -E tar cf "$GITHUB_WORKSPACE/KeyTempo-${{ matrix.name }}.zip" --format=zip -- *

      - uses: actions/upload-artifact@v4
        with:
          name: KeyTempo-${{ matrix.name }}
          path: KeyTempo-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: true
